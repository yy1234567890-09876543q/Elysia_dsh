<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSH 接口测试工具（JSON-RPC）</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; margin: 0; background: #f5f6fa; color: #222; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; color: #666; margin: 8px 0 4px; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { margin-top: 12px; padding: 10px 22px; background: #3b6cf6; color: #fff; border: 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button.sec { background: #e8ecf8; color: #333; }
  button:disabled { background: #9db4f5; cursor: not-allowed; }
  .log { background: #0f172a; color: #d7e3ff; border-radius: 8px; padding: 14px; font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; min-height: 140px; max-height: 420px; overflow-y: auto; }
  .err { color: #ff8a8a; }
  .ok { color: #7ee2a8; }
  .hint { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠 DSH 接口测试工具（JSON-RPC + 轮询）</h1>

  <div class="card">
    <label>DSH 服务地址（base，不含 /api）</label>
    <input id="base" value="http://127.0.0.1:3080">

    <label>选择会话</label>
    <div class="row">
      <select id="session" style="flex:1">
        <option value="">（点「加载会话」后选择）</option>
      </select>
      <button class="sec" id="btnLoad" type="button">加载会话</button>
    </div>

    <label>发送内容</label>
    <textarea id="msg">你好，用一句话介绍你自己</textarea>
    <button id="btnSend">发送并等待回复</button>
    <div class="hint">
      协议：POST /api/&lt;method&gt;（JSON-RPC）。发消息后每 1.5s 轮询 session/page 拿正文。<br>
      ⚠️ 若浏览器报 CORS / Failed to fetch：关掉 Chrome，用「Chrome(调试模式)」快捷方式打开本文件再试；
      或直接在命令行跑你自己的 <code>python dsh_api.py list</code> 验证。
    </div>
  </div>

  <div class="card">
    <div class="log" id="log">等待操作…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = (t, cls) => {
  const el = $('log');
  el.innerHTML = cls ? `<span class="${cls}">${t}</span>` : t;
  el.scrollTop = el.scrollHeight;
};
const append = t => { $('log').textContent += t; $('log').scrollTop = $('log').scrollHeight; };

async function rpc(method, args) {
  const base = $('base').value.trim().replace(/\/+$/, '');
  const rpcId = crypto.randomUUID();
  const body = {
    type: 'client-request', rpcId, method,
    payload: { args }
  };
  const resp = await fetch(`${base}/api/${method}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${(await resp.text()).slice(0,200)}`);
  const env = await resp.json();
  if (env.rpcId !== rpcId) throw new Error('rpcId 不匹配');
  if (!env.result || !env.result.ok) {
    const e = (env.result && env.result.error) || {};
    throw new Error(`${e.code||'error'}: ${e.message||''}`);
  }
  return env.result.value;
}

function extractTexts(records) {
  const out = [];
  for (const rec of records || []) {
    if (rec.type !== 'event') continue;
    if (rec.event && rec.event.type !== 'assistant/message') continue;
    const msg = rec.event && rec.event.data && rec.event.data.message;
    if (!msg || !msg.content) continue;
    const parts = msg.content.filter(b => b.type === 'text').map(b => b.text).filter(Boolean);
    const text = parts.join('\n').trim();
    if (text) out.push({ seq: rec.event.seq || 0, text });
  }
  return out;
}

$('btnLoad').onclick = async () => {
  try {
    $('btnLoad').disabled = true;
    log('正在拉取会话列表…');
    const v = await rpc('session/list', { _request: {} });
    const items = (v && v.items) || [];
    const sel = $('session');
    sel.innerHTML = '';
    items.forEach(s => {
      const title = ((s.projections && s.projections.values && s.projections.values.title)
        || s.sessionId.slice(-8));
      const opt = document.createElement('option');
      opt.value = s.sessionId;
      opt.textContent = (s.running ? '● ' : '') + title;
      sel.appendChild(opt);
    });
    log(`✅ 拉到 ${items.length} 个会话`, 'ok');
  } catch (e) {
    log(`❌ ${e.message}`, 'err');
  } finally {
    $('btnLoad').disabled = false;
  }
};

$('btnSend').onclick = async () => {
  const sid = $('session').value;
  const text = $('msg').value.trim();
  if (!sid) { log('❌ 请先选择会话', 'err'); return; }
  if (!text) return;

  try {
    $('btnSend').disabled = true;
    log('');
    append('我：' + text + '\n\n');

    // 发消息前记录 seq 基线
    const beforeList = await rpc('session/list', { _request: {} });
    const beforeItem = (beforeList.items || []).find(s => s.sessionId === sid);
    const before = (beforeItem && beforeItem.projections && beforeItem.projections.asOfSeq) || 0;

    // 发消息（只入队）
    await rpc('session/prompt', {
      request: {
        requestId: crypto.randomUUID(),
        sessionId: sid,
        mode: 'queue',
        clientTimeZone: 'Asia/Shanghai',
        content: [{ type: 'text', text }]
      }
    });
    append('（DSH 已接收，正在轮询回复…）\n\n');

    // 轮询
    let lastSeq = before;
    const deadline = Date.now() + 300000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1500));
      const list = await rpc('session/list', { _request: {} });
      const item = (list.items || []).find(s => s.sessionId === sid);
      const asOf = (item && item.projections && item.projections.asOfSeq) || 0;
      const page = await rpc('session/page', {
        request: {
          address: { kind: 'session', sessionId: sid },
          throughSeq: asOf,
          maxMessages: 200
        }
      });
      const news = extractTexts(page.records).filter(t => t.seq > lastSeq);
      for (const t of news) {
        lastSeq = t.seq;
        append(t.text + '\n\n');
      }
      if (news.length === 0 && item && !item.running && lastSeq > before) break;
    }
    append('\n✅ [结束]', 'ok');
  } catch (e) {
    log(`❌ ${e.message}`, 'err');
  } finally {
    $('btnSend').disabled = false;
  }
};
</script>
</body>
</html>
